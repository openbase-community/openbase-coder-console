<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      Assets are built with a relative base (see vite.config.ts) so the console
      also works behind a reverse-proxy subpath. This base anchors them at the
      server root for normal installs (deep links included). When proxied,
      Openbase Cloud injects its own <base> before this one, and the first
      <base> in the document wins.
    -->
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Openbase Coder Console</title>
    <meta name="description" content="React frontend console for Openbase Coder" />
    <meta name="author" content="openbase-community" />

    <meta property="og:title" content="Openbase Coder Console" />
    <meta property="og:description" content="React frontend console for Openbase Coder" />
    <meta property="og:type" content="website" />

    <link rel="icon" href="/images/favicon.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
